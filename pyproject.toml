[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unbake"
version = "0.1.0"
description = "PBR material estimation for meshes with baked-in lighting: dataset, baselines and evaluation, on top of TRELLIS.2"
requires-python = ">=3.10"
# Dependencies are installed separately (INSTALL.md): several need CUDA builds for the local GPU.

[tool.setuptools.packages.find]
include = ["unbake*", "trellis2*"]
